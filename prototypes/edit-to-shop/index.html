<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit to Shop</title>
<style>
  :root { --bg: #f6f4ef; --fg: #1b1a17; --muted: #77736a; --line: #dcd8cf; --card: #fff; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr) 360px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  h1 { font-size: 18px; margin: 0 0 4px; } p.sub { margin: 0 0 16px; color: var(--muted); }
  .stage { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; aspect-ratio: 1; }
  .stage img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .stage.busy::after { content: "Applying edit…"; position: absolute; inset: auto 12px 12px auto; background: var(--fg); color: var(--bg); padding: 6px 10px; border-radius: 6px; font-size: 13px; }
  form { display: flex; gap: 8px; margin-top: 12px; }
  input { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: var(--card); }
  button { padding: 10px 14px; border: 0; border-radius: 8px; background: var(--fg); color: var(--bg); font: inherit; cursor: pointer; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chips button { background: var(--card); color: var(--fg); border: 1px solid var(--line); padding: 5px 9px; font-size: 13px; }
  .history { display: flex; gap: 8px; margin-top: 14px; overflow-x: auto; }
  .history img { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; border: 2px solid transparent; cursor: pointer; }
  .history img.on { border-color: var(--fg); }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  .piece { font-size: 17px; font-weight: 600; } .query { color: var(--muted); font-size: 13px; margin: 2px 0 14px; }
  .prod { display: grid; grid-template-columns: 72px 1fr; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px; color: inherit; text-decoration: none; }
  .prod img, .prod .ph { width: 72px; height: 72px; object-fit: cover; border-radius: 6px; background: var(--line); }
  .prod b { display: block; font-size: 14px; font-weight: 500; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .meta { color: var(--muted); font-size: 13px; }
  .err { color: #a3301d; font-size: 13px; white-space: pre-wrap; } .timing { color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <section>
    <h1>Edit to Shop</h1>
    <p class="sub">Describe a change to the Cosmic Cowboy. The image updates, and the changed piece is matched to real products.</p>
    <div class="stage" id="stage"><img id="look" src="/base.png" alt="Current cowboy look"></div>
    <form id="f">
      <input id="prompt" placeholder="e.g. make the hat black and add a silver sheriff star" autocomplete="off">
      <button id="go">Apply</button>
      <button type="button" class="ghost" id="reset">Reset</button>
    </form>
    <div class="chips" id="chips"></div>
    <div class="history" id="history"></div>
  </section>
  <aside>
    <h2>Matched piece</h2>
    <div id="shop"><p class="meta">Nothing yet. Make an edit.</p></div>
    <div class="timing" id="timing"></div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let current = null;            // data URL of the current look, null = base image
const edits = [];              // prompts applied so far, sent so Claude knows the context
const frames = [{ src: "/base.png", image: null, n: 0 }];

for (const s of ["swap the boots for red snakeskin cowboy boots", "make the hat black felt", "add a turquoise bolo tie", "give him a fringed suede jacket"]) {
  const b = document.createElement("button"); b.type = "button"; b.textContent = s;
  b.onclick = () => { $("prompt").value = s; $("f").requestSubmit(); };
  $("chips").append(b);
}

function renderHistory() {
  $("history").innerHTML = "";
  frames.forEach((fr) => {
    const img = document.createElement("img"); img.src = fr.src;
    if ((fr.image ?? null) === current) img.className = "on";
    img.onclick = () => { current = fr.image; edits.length = fr.n; $("look").src = fr.src; renderHistory(); };
    $("history").append(img);
  });
}

function renderShop(shop) {
  if (shop.error) { $("shop").innerHTML = `<p class="err">${esc(shop.error)}</p>`; return; }
  const cards = shop.products.map((p) => `
    <a class="prod" href="${esc(p.url)}" target="_blank" rel="noopener">
      ${p.image ? `<img src="${esc(p.image)}" alt="" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph'}))">` : `<div class="ph"></div>`}
      <div><b>${esc(p.title)}</b><div class="meta">${esc(p.merchant)}${p.price ? " · " + esc(p.price) : ""}</div></div>
    </a>`).join("") || `<p class="meta">No independent shops in the results.</p>`;
  const dropped = shop.dropped.length ? `<p class="meta">Filtered out: ${esc([...new Set(shop.dropped)].join(", "))}</p>` : "";
  $("shop").innerHTML = `<div class="piece">${esc(shop.piece)}</div><div class="query">“${esc(shop.query)}”</div>${cards}${dropped}`;
}

$("reset").onclick = () => { current = null; edits.length = 0; frames.length = 1; $("look").src = "/base.png"; $("shop").innerHTML = `<p class="meta">Nothing yet. Make an edit.</p>`; $("timing").textContent = ""; renderHistory(); };

$("f").onsubmit = async (e) => {
  e.preventDefault();
  const prompt = $("prompt").value.trim(); if (!prompt) return;
  $("go").disabled = true; $("stage").classList.add("busy");
  $("shop").innerHTML = `<p class="meta">Finding the piece…</p>`; $("timing").textContent = "";
  try {
    const res = await fetch("/edit", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ prompt, image: current, history: edits }) });
    const out = await res.json();
    if (out.error) throw new Error(out.error);
    renderShop(out.shop);
    const t = [];
    if (out.shop.ms) t.push(`products ${(out.shop.ms / 1000).toFixed(1)}s`);
    if (out.image.error) { $("shop").insertAdjacentHTML("afterbegin", `<p class="err">${esc(out.image.error)}</p>`); }
    else {
      current = out.image.url; edits.push(prompt); $("look").src = current;
      frames.splice(edits.length); frames.push({ src: current, image: current, n: edits.length });
      t.push(`image ${(out.image.ms / 1000).toFixed(1)}s`); $("prompt").value = "";
    }
    $("timing").textContent = t.join(" · "); renderHistory();
  } catch (err) { $("shop").innerHTML = `<p class="err">${esc(err.message)}</p>`; }
  finally { $("go").disabled = false; $("stage").classList.remove("busy"); }
};
renderHistory();
</script>
</body>
</html>
