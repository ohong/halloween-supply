<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screenshot to Costume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400&family=Geist+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fff; --ink:#333; --btn:#111; --mid:#666; --soft:#999; --line:#ccc; --grey:#efeeef; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:300 15px/1.5 Geist, system-ui, sans-serif; }
  header { display:flex; justify-content:space-between; align-items:baseline; padding:20px 24px; border-bottom:1px solid var(--line); }
  header b { font-weight:400; letter-spacing:.02em; }
  header span { color:var(--soft); font:300 12px Geist Mono, monospace; }
  main { display:grid; grid-template-columns: 340px 1fr; min-height: calc(100vh - 62px); }
  aside { border-right:1px solid var(--line); display:flex; flex-direction:column; }
  #drop { margin:24px; aspect-ratio: 3/4; border:1px dashed var(--line); display:grid; place-items:center; text-align:center; color:var(--soft); cursor:pointer; position:relative; overflow:hidden; }
  #drop.over { border-color:var(--ink); color:var(--ink); }
  #drop img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #drop p { margin:0; padding:0 24px; font-size:13px; }
  .samples { display:flex; gap:6px; padding:0 24px 16px; flex-wrap:wrap; }
  .samples button, #go { font:400 12px Geist, sans-serif; border-radius:4px; cursor:pointer; }
  .samples button { background:none; border:1px solid var(--line); color:var(--mid); padding:5px 9px; }
  .samples button:hover { border-color:var(--ink); color:var(--ink); }
  #go { margin:0 24px 24px; padding:12px; background:var(--btn); color:#fff; border:0; }
  #go:disabled { opacity:.35; cursor:default; }
  #log { flex:1; min-height:200px; max-height:42vh; overflow:auto; border-top:1px solid var(--line); padding:14px 24px; font:300 11.5px/1.7 Geist Mono, monospace; color:var(--mid); }
  #log div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; animation: in .18s ease-out; }
  #log .ms { color:var(--line); display:inline-block; width:44px; }
  #log .blocked { color:var(--soft); text-decoration:line-through; }
  #log .blocked::after { content:"  ✕ blocked"; text-decoration:none; display:inline-block; margin-left:6px; }
  #log .skip { color:var(--line); }
  #log .found { color:var(--ink); }
  #log .fail, #log .error { color:#a33; }
  #log .look { color:var(--ink); }
  @keyframes in { from { opacity:0; transform:translateX(-4px); } }
  section { display:flex; flex-direction:column; }
  .head { padding:28px 32px 18px; display:flex; justify-content:space-between; align-items:flex-end; gap:24px; }
  .head h1 { margin:0; font-weight:300; font-size:30px; letter-spacing:-.01em; }
  .head p { margin:4px 0 0; color:var(--mid); font-size:13px; max-width:52ch; }
  .tot { text-align:right; white-space:nowrap; }
  .tot b { display:block; font:300 30px Geist Mono, monospace; }
  .tot small { color:var(--soft); font:300 12px Geist Mono, monospace; }
  #lay { flex:1; margin:0 32px 32px; background:var(--grey); padding:40px; display:grid; grid-template-columns: repeat(3, 1fr); gap:40px 32px; align-content:center; }
  .slot { display:flex; flex-direction:column; gap:8px; }
  .frame { aspect-ratio:1; display:grid; place-items:center; position:relative; }
  .frame img { width:86%; height:86%; object-fit:contain; mix-blend-mode:multiply; opacity:0; }
  .frame img.snap { animation: snap .55s cubic-bezier(.2,.9,.3,1.2) forwards; }
  @keyframes snap {
    from { opacity:0; transform: translateY(-24px) rotate(var(--r)) scale(1.08); }
    to { opacity:1; transform:none; }
  }
  .ghost { position:absolute; inset:14%; border:1px dashed var(--line); display:grid; place-items:center; color:var(--soft); font-size:12px; text-align:center; padding:8px; animation: pulse 1.4s ease-in-out infinite; }
  .ghost.gone { display:none; }
  .ghost.miss { animation:none; }
  @keyframes pulse { 50% { opacity:.45; } }
  .cap { font-size:12px; line-height:1.4; min-height:34px; }
  .cap a { color:var(--ink); text-decoration:none; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cap span { color:var(--soft); font-family:Geist Mono, monospace; font-size:11px; }
  .empty { grid-column:1/-1; text-align:center; color:var(--soft); font-size:13px; }
  @media (max-width: 820px) {
    main { grid-template-columns:1fr; }
    aside { border-right:0; border-bottom:1px solid var(--line); }
    #drop { margin:16px; aspect-ratio:4/3; }
    .samples, #log { padding-left:16px; padding-right:16px; }
    #go { margin:0 16px 16px; }
    .head { padding:20px 16px 12px; }
    .head h1, .tot b { font-size:22px; }
    #lay { margin:0 16px 16px; padding:20px; grid-template-columns:repeat(2,1fr); gap:24px 16px; }
  }
</style>
</head>
<body>
<header><b>Halloween.Supply</b><span>screenshot → costume · prototype</span></header>
<main>
  <aside>
    <label id="drop"><p>Drop, paste or pick any screenshot of a character</p><input id="file" type="file" accept="image/*" hidden></label>
    <div class="samples" id="samples"></div>
    <button id="go" disabled>Build the costume</button>
    <div id="log"></div>
  </aside>
  <section>
    <div class="head">
      <div><h1 id="title">Your costume</h1><p id="summary">Every piece comes from an independent shop, found live.</p></div>
      <div class="tot"><b id="total">$0.00</b><small id="meta">&nbsp;</small></div>
    </div>
    <div id="lay"><div class="empty">The flat-lay assembles here.</div></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const SAMPLES = ["velvet-vampire", "cosmic-cowboy", "linen-ghost", "moon-moth", "woodland-mushroom"];
let image = null, running = false;

// Display pacing only: real events queue up and drip in so a burst stays readable.
const queue = [];
setInterval(() => { const f = queue.shift(); if (f) f(); }, 60);

function logLine(kind, text, ms) {
  queue.push(() => {
    const d = document.createElement("div");
    d.className = kind;
    d.innerHTML = `<span class="ms">${ms != null ? (ms / 1000).toFixed(1) + "s" : ""}</span>`;
    d.append(text);
    $("log").append(d);
    $("log").scrollTop = $("log").scrollHeight;
  });
}

function setImage(dataUrl) {
  image = dataUrl;
  $("drop").querySelector("img")?.remove();
  const img = new Image(); img.src = dataUrl; $("drop").append(img);
  $("go").disabled = running;
}
function readFile(file) { if (!file?.type.startsWith("image/")) return; const r = new FileReader(); r.onload = () => setImage(r.result); r.readAsDataURL(file); }

$("file").onchange = (e) => readFile(e.target.files[0]);
$("drop").ondragover = (e) => { e.preventDefault(); $("drop").classList.add("over"); };
$("drop").ondragleave = () => $("drop").classList.remove("over");
$("drop").ondrop = (e) => { e.preventDefault(); $("drop").classList.remove("over"); readFile(e.dataTransfer.files[0]); };
addEventListener("paste", (e) => readFile([...e.clipboardData.files][0]));
for (const name of SAMPLES) {
  const b = document.createElement("button");
  b.textContent = name.replace("-", " ");
  b.onclick = async () => { const blob = await (await fetch(`/samples/${name}.png`)).blob(); readFile(new File([blob], name, { type: blob.type })); };
  $("samples").append(b);
}

// Total ticks up toward its target instead of jumping.
let shown = 0, target = 0;
function tick() { shown += (target - shown) * 0.18; if (Math.abs(target - shown) < 0.5) shown = target; $("total").textContent = "$" + (shown / 100).toFixed(2); if (shown !== target) requestAnimationFrame(tick); }
function addToTotal(cents) { const idle = shown === target; target += cents; if (idle) requestAnimationFrame(tick); }

function renderSlots(pieces) {
  $("lay").innerHTML = "";
  pieces.forEach((p, i) => {
    const s = document.createElement("div");
    s.className = "slot"; s.id = "slot" + i;
    s.innerHTML = `<div class="frame"><div class="ghost">${p.name}</div></div><div class="cap"><span>${p.slot}</span></div>`;
    $("lay").append(s);
  });
}

function placePiece(i, product) {
  const s = $("slot" + i); if (!s) return;
  const ghost = s.querySelector(".ghost");
  if (!product) { ghost.classList.add("miss"); ghost.textContent += " — not found"; return; }
  const img = new Image();
  img.referrerPolicy = "no-referrer";
  img.style.setProperty("--r", (Math.random() * 16 - 8).toFixed(1) + "deg");
  img.onload = () => { ghost.classList.add("gone"); img.classList.add("snap"); addToTotal(product.priceCents); };
  img.onerror = () => { ghost.textContent = "image blocked"; addToTotal(product.priceCents); };
  img.src = product.image;
  s.querySelector(".frame").append(img);
  const cap = s.querySelector(".cap");
  cap.innerHTML = `<a href="${product.url}" target="_blank" rel="noopener"></a><span>${product.merchant} · $${(product.priceCents / 100).toFixed(2)}</span>`;
  cap.querySelector("a").textContent = product.title;
}

$("go").onclick = async () => {
  running = true; $("go").disabled = true;
  $("log").innerHTML = ""; queue.length = 0; shown = target = 0; $("total").textContent = "$0.00";
  $("title").textContent = "Reading the look…"; $("summary").textContent = ""; $("meta").innerHTML = "&nbsp;";
  $("lay").innerHTML = "";
  const t0 = performance.now(), shops = new Set();
  let found = 0, pieces = [];
  try {
    const res = await fetch("/run", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ image }) });
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const e = JSON.parse(buf.slice(0, nl)); buf = buf.slice(nl + 1);
        if (e.t === "log") logLine(e.kind, e.text, e.ms);
        else if (e.t === "look") {
          pieces = e.pieces;
          logLine("look", `${e.character}: ${e.pieces.length} pieces`, e.ms);
          $("title").textContent = e.character; $("summary").textContent = e.summary;
          renderSlots(e.pieces);
        } else if (e.t === "piece") {
          queue.push(() => placePiece(e.index, e.product));
          if (e.product) { found++; shops.add(e.product.merchant); }
          queue.push(() => { $("meta").textContent = `${found}/${pieces.length} pieces · from ${shops.size} independent shop${shops.size === 1 ? "" : "s"}`; });
        } else if (e.t === "done") logLine("look", `done in ${(e.ms / 1000).toFixed(1)}s`, e.ms);
        else if (e.t === "error") logLine("error", e.text, e.ms);
      }
    }
  } catch (err) {
    logLine("error", String(err));
  }
  queue.push(() => { $("meta").textContent += ` · ${((performance.now() - t0) / 1000).toFixed(0)}s`; });
  running = false; $("go").disabled = !image;
};
</script>
</body>
</html>
