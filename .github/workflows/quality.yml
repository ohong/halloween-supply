name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, build, and production smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.3"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check types
        run: bun run typecheck

      - name: Build production app
        run: bun run build

      - name: Install Chromium
        run: bunx --no-install playwright install --with-deps chromium

      - name: Verify local production app
        run: bun run verify:release

      - name: Retain public smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-smoke-${{ github.run_attempt }}
          path: |
            tmp/verification/release/summary.json
            tmp/verification/release/browser.json
            tmp/verification/release/desktop.png
            tmp/verification/release/phone.png
            tmp/verification/release/failure.png
          if-no-files-found: ignore
          retention-days: 7
